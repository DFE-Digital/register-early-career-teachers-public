---
openapi: 3.0.3
info:
  title: Register early career teachers API
  version: v3
paths:
  "/api/v3/delivery-partners":
    get:
      operationId: getDeliveryPartners
      summary: Get delivery partners
      tags:
      - Delivery partners
      parameters:
      - name: page
        in: query
        required: false
        style: deepObject
        explode: true
        schema:
          type: object
          properties:
            page:
              type: integer
              minimum: 1
              example: 1
            per_page:
              type: integer
              minimum: 1
              example: 300
      - name: sort
        in: query
        required: false
        description: Sort the response. Prefix with '-' for descending order.
        schema:
          type: string
          enum:
          - created_at
          - "-created_at"
          - updated_at
          - "-updated_at"
          - name
          - "-name"
          example: "-created_at"
      - name: filter[cohort]
        in: query
        required: false
        description: Comma-separated cohort years.
        schema:
          type: string
          example: '2021,2022'
      responses:
        '200':
          description: A list of delivery partners.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/DeliveryPartner"
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                      total_pages:
                        type: integer
              example:
                data:
                - id: d50cc706-b6b4-46b5-839b-653584140880
                  type: delivery-partner
                  attributes:
                    name: Delivery Partner 1
                    created_at: '2026-09-02T08:36:39Z'
                    updated_at: '2026-09-02T08:36:39Z'
                    cohort:
                    - '2021'
components:
  schemas:
    DeliveryPartner:
      description: A delivery partner.
      type: object
      required:
      - id
      - type
      - attributes
      properties:
        id:
          description: The unique ID of the resource.
          type: string
          format: uuid
          example: d0b4a32e-a272-489e-b30a-cb17131457fc
        type:
          type: string
          description: The data type.
          enum:
          - delivery-partner
          example: delivery-partner
        attributes:
          type: object
          required:
          - name
          - created_at
          - updated_at
          - cohort
          properties:
            name:
              type: string
              description: The name of the delivery partner you are working with.
              example: Awesome Delivery Partner Ltd
            created_at:
              type: string
              description: The date and time the delivery partner was created.
              example: '2021-05-31T02:22:32.000Z'
              format: date-time
            updated_at:
              type: string
              description: The date and time the delivery partner was last updated.
              example: '2021-05-31T02:22:32.000Z'
              format: date-time
            cohort:
              type: array
              description: The cohorts for which you may report school partnerships with this delivery partner.
              example:
              - '2021'
              - '2022'
              items:
                type: string
