---
openapi: 3.0.1
info:
  title: Lead Provider API
  version: v3
externalDocs:
  description: Find out more about Swagger
  url: https://swagger.io/
paths:
  "/api/v3/delivery-partners":
    get:
      summary: Retrieve multiple delivery partners
      tags:
      - Delivery Partners
      security:
      - api_key: []
      operationId: getDeliveryPartners
      parameters:
      - name: Pagination
        in: query
        required: false
        schema:
          "$ref": "#/components/schemas/Pagination"
      - name: DeliveryPartnersFilter
        in: query
        required: false
        schema:
          "$ref": "#/components/schemas/DeliveryPartnersFilter"
      responses:
        '200':
          description: A list of delivery partners
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/DeliveryPartner"
components:
  securitySchemes:
    api_key:
      type: http
      scheme: bearer
      description: Bearer token
  schemas:
    DeliveryPartner:
      description: A delivery partner.
      type: object
      required:
      - id
      - type
      - attributes
      properties:
        id:
          description: The unique ID of the resource.
          type: string
          format: uuid
          example: d0b4a32e-a272-489e-b30a-cb17131457fc
        type:
          type: string
          description: The data type.
          enum:
          - delivery-partner
          example: delivery-partner
        attributes:
          type: object
          required:
          - name
          - created_at
          - updated_at
          - cohort
          properties:
            name:
              type: string
              description: The name of the delivery partner you are working with.
              example: Awesome Delivery Partner Ltd
            created_at:
              type: string
              description: The date and time the delivery partner was created.
              example: '2021-05-31T02:22:32.000Z'
              format: date-time
            updated_at:
              type: string
              description: The date and time the delivery partner was last updated.
              example: '2021-05-31T02:22:32.000Z'
              format: date-time
            cohort:
              description: The cohorts for which you may report school partnerships
                with this delivery partner.
              example:
              - '2021'
              - '2022'
              type: array
              items:
                type: string
    Pagination:
      description: Pagination information for API responses.
      type: object
      required:
      - page
      - per_page
      properties:
        page:
          type: integer
          description: The current page number.
          example: 1
        per_page:
          type: integer
          description: The number of items per page.
          example: 20
    DeliveryPartnersFilter:
      description: Filter parameters for delivery partners API endpoint.
      type: object
      required:
      - cohort
      properties:
        cohort:
          type: integer
          description: The cohort year to filter delivery partners by.
          example: 2022
