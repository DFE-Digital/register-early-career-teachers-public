name: "Copilot Setup Steps"

# Prepares the environment for Copilot cloud agent and Copilot code review
# sessions that run on GitHub Actions. Copilot only picks this up once it is on
# the default branch. It runs here when changed so the setup can be validated.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` or Copilot will not use it.
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ""
          POSTGRES_HOST_AUTH_METHOD: "trust"
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

      redis:
        image: redis
        ports:
          - 6379:6379
        options: --entrypoint redis-server

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Copilot ignores job-level env, so export the test settings
      # through GITHUB_ENV for subsequent steps and the Copilot session.
      - name: Configure test environment
        run: |
          cat >> "$GITHUB_ENV" <<'EOF'
          RAILS_ENV=test
          DB_USERNAME=postgres
          DB_PASSWORD=
          DB_HOSTNAME=127.0.0.1
          DB_PORT=5432
          ECF_DB_USERNAME=postgres
          ECF_DB_PASSWORD=
          ECF_DB_HOSTNAME=127.0.0.1
          ECF_DB_PORT=5432
          ANALYTICS_DB_USERNAME=postgres
          ANALYTICS_DB_PASSWORD=
          ANALYTICS_DB_HOSTNAME=127.0.0.1
          ANALYTICS_DB_PORT=5432
          ENCRYPTION_PRIMARY_KEY=test_primary_key
          ENCRYPTION_DETERMINISTIC_KEY=test_deterministic_key
          ENCRYPTION_DERIVATION_SALT=test_derivation_salt
          CI=true
          REDIS_CACHE_URL=redis://127.0.0.1:6379
          EOF

      - name: Read Node.js version
        id: node-version
        run: echo "version=$(tr -d '[:space:]' < .node-version)" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/prepare-app-env
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          prepare-test-database: "true"
          prepare-assets: "true"

      # Skipped when Copilot runs the setup steps, to avoid slowing down its sessions.
      - name: Run smoke specs
        if: contains(fromJSON('["pull_request", "workflow_dispatch"]'), github.event_name)
        run: >-
          bundle exec rspec
          spec/models/contract_period_spec.rb
          spec/requests/health_check_controller_spec.rb
          spec/features/admin_spec.rb
