name: Remind us to update Find and Use an API when we make changes to our OpenAPI documentation

on:
  pull_request:
    # by default, this triggers when a PR is opened, reopened, or synchronized
    # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#pull_request
    paths:
      # this triggers when changes are made to our OpenAPI documentation
      - "**/*swagger*.yml"
      - "**/*swagger*.yaml"
      - "**/*openapi*.yml"
      - "**/*openapi*.yaml"

jobs:
  check-openapi-changes:
    name: Prompt the author to update FAUAPI when the OpenAPI documentation changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment on PR about schema changes
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const author = pr.user.login;
            const commentBody = `Hey @${author}, this modifies the OpenAPI documentation. Please remember to update [FAUAPI](https://apimanagement.education.gov.uk/workspace/59) if necessary.`;

            // Get all comments on the PR
            const comments = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo
            });

            // Check if a comment already exists
            const commentExists = comments.data.some(comment =>
              comment.body.includes('OpenAPI documentation') &&
              comment.body.includes('FAUAPI')
            );

            // Only add a comment if one doesn't already exist
            if (!commentExists) {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: commentBody
              });
            }
